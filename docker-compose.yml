# Local TimescaleDB (PostgreSQL 16) for the Phase 3 migration.
#
#   docker compose up -d timescaledb
#   psql "postgresql://bharat:bharat@localhost:5433/bharat_intel" -f db/schema.postgres.sql
#
# Port 5433 (not 5432) to avoid clashing with any existing local Postgres.
# Credentials are read from .env (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB) with
# dev-only fallbacks — set strong values in .env before any non-local use.
services:
  redis:
    image: redis:7-alpine
    container_name: bharat_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-bharatredis}
      --acllog-max-len 0
      --maxclients 1000
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # AOF persistence so a container restart doesn't orphan in-flight BullMQ jobs
      # (this is the sole broker now — the native winget redis was retired to end the
      # 6379 split-brain that undermined stalled-job recovery).
      - bharat_redisdata:/data
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bharatredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: bharat_timescaledb
    restart: unless-stopped
    # Docker defaults /dev/shm to 64MB. Parallel query workers (max_parallel_workers_per_gather=2)
    # spill hash/sort state into shared memory, and the big resolver joins (e.g. the 50k-row
    # live_screener_resolver scan) overflowed it → "DiskFull: could not resize shared memory
    # segment ... No space left on device". The data volume has >900GB free; this is purely
    # the shm segment. 1GB is ample headroom for this single-box workload.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bharat}
      POSTGRES_DB: ${POSTGRES_DB:-bharat_intel}
      # Tuned for a single-box analytics workload.
      # 2026-08-09: raised 2GB->6GB after this workload's real analytical queries (multi-
      # million-row sorts over confluence_signals, hypertable decompression scans) were
      # confirmed live to OOM-kill the Postgres backend under a 2GB cap ("server closed the
      # connection unexpectedly" mid-query) -- the host actually has 24GB RAM and an
      # explicit .wslconfig now caps WSL2/Docker Desktop at 14GB, so 6GB is well within
      # that ceiling with room for Redis + Docker overhead alongside it.
      # shared_buffers = 25% of TS_TUNE_MEMORY (matches the ratio this file already used).
      TS_TUNE_MEMORY: 6GB
      TS_TUNE_NUM_CPUS: "4"
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=1536MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=4GB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c effective_io_concurrency=200
      -c random_page_cost=1.1
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bharat_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bharat} -d ${POSTGRES_DB:-bharat_intel}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bharat_pgdata:
  bharat_redisdata:
