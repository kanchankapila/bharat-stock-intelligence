[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bharat-alpha"
version = "0.1.0"
description = "Point-in-time, self-grading cross-sectional prediction engine for NSE equities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4,<1.9",  # 1.9.x pyds blocked by Windows Smart App Control (2026-10-07); 1.8.0 is what production runs
  "lightgbm>=4.3",
  "psycopg[binary]>=3.2,!=3.3.6",  # 3.3.6 bundles a libpq DLL that Windows Smart App Control blocks (2026-10-07)
  "pyarrow>=15",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "requests>=2.31",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bqa = "bharat_alpha.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live_datasource: hits a real third-party endpoint; opt in with RUN_LIVE_DATASOURCE_TESTS=1",
  "slow: end-to-end pipeline runs (a few seconds to a minute)",
]
