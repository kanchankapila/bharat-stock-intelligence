[pytest]
# Bare `pytest` at the repo root used to collect every test_*.py under the tree,
# including three throwaway scripts in the gitignored scratch/ directory that are not
# importable (test_50_stocks.py, test_actions_comp.py, write_final_test.py). That made the
# canonical DoD command fail at COLLECTION -- before a single real test ran -- whenever a
# developer had those files lying around locally.
#
# testpaths pins bare `pytest` to exactly the same three roots CI and CLAUDE.md's
# Definition-of-Done use:
#     python -m pytest src/server/__tests__/ src/server/tests/ tests/chatbot/ -q
# Explicit path invocations are unaffected -- this only supplies a default when no path is
# given, so CI's DoD command keeps behaving identically.
#
# scripts/ is deliberately NOT listed: its test_*.py files are operational harnesses with
# side effects (test_backup_pg_verify.py, test_pg_connection.py), not unit tests, and CI
# does not collect them either.
testpaths =
    src/server/__tests__
    src/server/tests
    tests/chatbot
