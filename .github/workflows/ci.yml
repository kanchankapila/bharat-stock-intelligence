name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Typecheck + unit tests only. Both run with no external services: vitest uses an
# in-memory SQLite DB (vite.config injects only GEMINI_API_KEY, never USE_POSTGRES),
# and tsc needs nothing. Postgres/Python (incl. the ML walk-forward leakage-regression
# test) require services and are a follow-on lane — see prod-readiness P5.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Unit tests
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ORDER MATTERS. This step used to install the requirements file first and CPU
      # torch second, which did NOT produce a CPU build: `transformers` and
      # `sentence-transformers` both depend on torch, so the requirements install
      # already resolved the default (CUDA) wheel, and the CPU install that followed
      # found the requirement satisfied and did nothing — silently, exit 0.
      # Measured 2026-08-13 with `uv pip install --dry-run`: the CPU index resolves
      # 0 nvidia/cuda packages, `sentence-transformers==5.5.1` off the default index
      # resolves 18. So every run of this job was downloading and caching several GB
      # of CUDA libraries onto a runner with no GPU, under a step named "CPU torch".
      # Installing CPU torch FIRST is what makes it the build everything else
      # resolves against. Do not reorder these two lines.
      - name: Install dependencies (CPU torch — no CUDA runner in CI)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch' backend-python/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      # The bug above was invisible for its whole life because the install step exits
      # 0 either way — nothing downstream ever checked which torch it got. So assert
      # on the artifact, not the exit code.
      #
      # `torch.version.cuda` is the predicate: None on a CPU build, a version string
      # ("13.0") on a CUDA one. Do NOT rewrite this to count `nvidia-*` packages —
      # that was the first attempt and it failed CI on 2026-08-13 against a correctly
      # CPU-built torch. `xgboost` declares `nvidia-nccl-cu12; platform_system ==
      # 'Linux'` unconditionally, so one nvidia package is present on this runner no
      # matter which torch is installed. (torch's own CUDA dep is nvidia-nccl-**cu13**
      # — a different package.) Counting nvidia packages measures "did anything in the
      # tree want CUDA", which is not the question.
      - name: Assert CPU-only torch (guards the install order above)
        run: |
          python - <<'PY'
          import sys, torch
          cuda = torch.version.cuda
          print(f"torch {torch.__version__}   torch.version.cuda={cuda}")
          if cuda is not None:
              print(f"::error::torch is a CUDA build (cuda={cuda}) on a GPU-less runner. "
                    "The CPU-torch install must come BEFORE the requirements install in "
                    "the previous step, or transformers/sentence-transformers resolve the "
                    "default CUDA wheel first and the CPU install becomes a no-op.")
              sys.exit(1)
          print("CPU-only torch confirmed.")
          PY

      # Hard gate (2026-07-18): the 13 pre-existing failures this job used to tolerate are
      # fixed — mostly stale test fixtures (schema drift after migrations, hardcoded dates
      # vs a rolling now()-window filter, mismatched mock signatures) plus two real bugs
      # (ohlcv_quality.flag_bad_prints and strategy_optimizer/feature_engineering's read
      # paths silently bypassed the caller's `conn` via a global-engine read_df() helper).
      # Verified this job's actual environment (no .env, no Postgres service) passes clean:
      # temporarily hid .env locally and ran the full suite with USE_POSTGRES/POSTGRES_*
      # unset and DATABASE_URL pointed at a nonexistent sqlite file — 391/391 passed.
      # Both dirs, deliberately: src/server/__tests__/ holds 14 .py files (the whole
      # unified_ranker / ml_ensemble / factor_backtest / direction-invariant suite) that
      # this job silently never collected -- there is no pytest testpaths config and no
      # root conftest.py, so `pytest src/server/tests/` excluded exactly the tests written
      # to lock in the ranker fixes. Keep this string identical to CLAUDE.md's
      # Definition of Done, or the two drift again.
      - name: Run pytest
        run: python -m pytest src/server/__tests__/ src/server/tests/ -q

      # Static checks for the bug classes that have each recurred 3-10+ times
      # (date.today() write-anchors, raw %s placeholders, fetchers with no
      # live_datasource test). --diff against the base ref so this blocks NEW
      # occurrences without demanding the existing backlog be cleared first;
      # run `python scripts/check_recurring_bugs.py` with no args for the full list.
      # Base ref is always a BRANCH NAME, never github.event.before: on a new-branch push
      # that is the all-zero SHA, the fetch fails, FETCH_HEAD is unset, and the old HEAD~1
      # fallback can't work either because actions/checkout clones with depth 1.
      - name: Recurring-bug checks (changed files only)
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          python scripts/check_recurring_bugs.py --diff FETCH_HEAD

  smoke-test:
    runs-on: ubuntu-latest
    # Boots the real tRPC router in-process (no Express/Redis/Ollama — see
    # scripts/ci_smoke_test.ts's header comment) against a fresh Postgres schema and calls
    # ~10 read-only, DB-only procedures. Catches "router code references a column
    # schema.postgres.sql doesn't have" bugs that unit tests (mocked DB) and typecheck (no
    # runtime DB access) both miss. Added 2026-07-18 after this exact class of bug
    # (getBuyRecommendations referencing a nonexistent ts.signal_strength column) was found
    # by hand-running this script locally — this job makes that check automatic.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: bharat
          POSTGRES_PASSWORD: bharat
          POSTGRES_DB: bharat_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_POSTGRES: 'true'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: bharat
      POSTGRES_DB: bharat_intel
      POSTGRES_URL: postgresql://bharat:bharat@127.0.0.1:5432/bharat_intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: PGPASSWORD=bharat psql -h 127.0.0.1 -U bharat -d bharat_intel -f db/schema.postgres.sql

      - name: Run smoke test
        run: npm run smoke:ci
